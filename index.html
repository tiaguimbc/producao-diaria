<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produção Diária - PCP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(248, 250, 252, 0.7), rgba(248, 250, 252, 0.8)), url('unnamed.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-button.active { 
            background-color: white;
            border-bottom: 3px solid #2563eb; 
            color: #1e40af;
            font-weight: 800;
        }
        .card-animation { animation: fadeInScale 0.3s ease-out forwards; }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .solid-panel { background-color: #ffffff; border: 1px solid #e2e8f0; }
        
        #loading-overlay, #cloud-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        #loading-overlay { background: rgba(255,255,255,0.95); flex-direction: column; }
        #cloud-modal-overlay { background: rgba(15, 23, 42, 0.6); padding: 1rem; }
    </style>
</head>
<body class="text-slate-900 pb-10">

    <div id="loading-overlay">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-600 border-r-4 border-transparent mb-4"></div>
        <p id="loading-text" class="font-black text-blue-800 uppercase tracking-widest text-sm animate-pulse">Processando...</p>
    </div>

    <div id="cloud-modal-overlay">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl flex flex-col max-h-[80vh] overflow-hidden card-animation border border-slate-200">
            <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-black text-slate-800 uppercase tracking-tight flex items-center gap-2">
                    <i data-lucide="cloud" class="w-5 h-5 text-violet-600"></i> KITS NO ESTOQUE
                </h3>
                <button onclick="fecharEstoqueNuvem()" class="text-slate-400 hover:text-red-500 transition-colors bg-white border border-slate-200 p-1.5 rounded-lg shadow-sm">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div id="cloud-modal-list" class="p-4 overflow-y-auto flex-1 bg-white"></div>
        </div>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(typeof finalizeSubmit === 'function') finalizeSubmit()"></iframe>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <div class="flex items-center gap-4">
                <img src="https://raw.githubusercontent.com/tiagomedeiros-star/Produ-o-diaria/main/logoqueonetics.png" alt="Queonetics Logo" class="h-10 object-contain">
                <div class="hidden md:block h-8 w-px bg-slate-200"></div>
                <h1 class="text-lg font-black text-slate-800 uppercase tracking-tight">Produção Diária - PCP</h1>
            </div>
            
            <div class="flex flex-col md:flex-row items-center gap-3 w-full md:w-auto">
                <div class="relative w-full md:w-64">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="search-input" oninput="filterCards()" placeholder="Procurar..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-full text-sm outline-none">
                </div>
                
                <div class="flex gap-2">
                    <a href="https://catalogo-de-kits-queonetics.vercel.app/" target="_blank" class="bg-slate-50 hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-full text-[9px] font-bold uppercase transition-all flex items-center gap-2 border border-slate-200 shadow-sm">
                        <i data-lucide="book-open" class="w-3.5 h-3.5 text-blue-600"></i> Catálogo
                    </a>
                    <a href="https://converso-cartao-rfid.vercel.app/" target="_blank" class="bg-slate-50 hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-full text-[9px] font-bold uppercase transition-all flex items-center gap-2 border border-slate-200 shadow-sm">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-blue-600"></i> Conversor
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex solid-panel rounded-2xl shadow-sm mb-6 p-1 overflow-x-auto">
            <button onclick="switchTab('tiago')" id="btn-tiago" class="tab-button active flex-1 px-4 py-3 text-xs flex items-center justify-center gap-2 rounded-xl transition-all"><i data-lucide="user" class="w-4 h-4"></i> TIAGO</button>
            <button onclick="switchTab('alana')" id="btn-alana" class="tab-button flex-1 px-4 py-3 text-xs flex items-center justify-center gap-2 rounded-xl transition-all"><i data-lucide="user" class="w-4 h-4"></i> ALANA</button>
            <button onclick="switchTab('william')" id="btn-william" class="tab-button flex-1 px-4 py-3 text-xs flex items-center justify-center gap-2 rounded-xl transition-all"><i data-lucide="user" class="w-4 h-4"></i> WILLIAM</button>
            <button onclick="switchTab('viviane')" id="btn-viviane" class="tab-button flex-1 px-4 py-3 text-xs flex items-center justify-center gap-2 rounded-xl transition-all"><i data-lucide="user" class="w-4 h-4"></i> VIVIANE</button>
            
            <button onclick="switchTab('bolsoes')" id="btn-bolsoes" class="tab-button flex-1 px-4 py-3 text-xs flex items-center justify-center gap-2 rounded-xl transition-all text-violet-600 font-bold"><i data-lucide="package" class="w-4 h-4"></i> KITS - ESTOQUE</button>
            
            <button onclick="switchTab('concluidos')" id="btn-concluidos" class="tab-button flex-1 px-4 py-3 text-xs flex items-center justify-center gap-2 rounded-xl transition-all text-emerald-600"><i data-lucide="check-circle" class="w-4 h-4"></i> CONCLUÍDOS</button>
            <button onclick="switchTab('etiquetas')" id="btn-etiquetas" class="tab-button flex-1 px-4 py-3 text-xs flex items-center justify-center gap-2 rounded-xl transition-all text-amber-600"><i data-lucide="tag" class="w-4 h-4"></i> ETIQUETAS</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <aside class="space-y-4">
                <div class="solid-panel p-5 rounded-3xl shadow-sm">
                    <h2 class="font-bold text-slate-700 mb-4 uppercase text-[10px] tracking-widest">Importar para: <span id="current-name" class="text-blue-600">Tiago</span></h2>
                    <div class="space-y-3">
                        <label class="relative block group">
                            <div class="h-28 border-2 border-dashed border-slate-200 rounded-2xl flex flex-col items-center justify-center bg-slate-50 group-hover:bg-blue-50 cursor-pointer transition-all text-center px-4">
                                <i data-lucide="file-spreadsheet" class="w-8 h-8 text-slate-300"></i>
                                <span class="text-[10px] font-bold text-slate-400 mt-2 uppercase">Clique para selecionar CSV ou XLSX</span>
                            </div>
                            <input type="file" id="file-input" accept=".csv, .xlsx, .xls" class="hidden" onchange="handleFileUpload(event)">
                        </label>
                        
                        <textarea id="paste-area" placeholder="Cole tabela para adicionar chamados OU cole lista de seriais..." class="w-full h-20 p-4 border border-slate-200 rounded-2xl text-[10px] outline-none bg-slate-50 resize-none"></textarea>
                        
                        <div class="flex gap-2">
                            <button onclick="processPastedData()" class="flex-1 bg-slate-900 text-white py-2.5 rounded-xl font-bold text-[9px] uppercase shadow-lg hover:bg-slate-800 transition-all">Importar</button>
                            <button onclick="formatarSeriais()" id="btn-formatar" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold text-[9px] uppercase shadow-lg hover:bg-blue-700 transition-all flex items-center justify-center gap-1"><i data-lucide="code" class="w-3 h-3"></i> Por Vírgulas</button>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-900 p-5 rounded-3xl text-white shadow-lg">
                    <div class="grid grid-cols-3 gap-2 mb-4 text-center">
                        <div class="bg-white/5 p-2 rounded-xl border border-white/10 flex flex-col justify-center"><p class="text-[8px] opacity-50 uppercase mb-1">Pendentes</p><p class="text-xl font-black leading-none" id="stat-total">0</p></div>
                        <div class="bg-white/5 p-2 rounded-xl border border-white/10 flex flex-col justify-center"><p class="text-[8px] opacity-50 uppercase mb-1">Feitos</p><p class="text-xl font-black text-emerald-400 leading-none" id="stat-done">0</p></div>
                        
                        <div onclick="abrirEstoqueNuvem()" class="bg-violet-900/40 p-2 rounded-xl border border-violet-500/30 cursor-pointer hover:bg-violet-800/60 transition-colors shadow-lg shadow-violet-900/20 group flex flex-col justify-center" title="Clique para ver a lista de Kits no Estoque">
                            <p class="text-[7.5px] leading-tight opacity-70 uppercase text-violet-300 flex items-center justify-center gap-1 text-center mb-1">KITS - ESTOQUE <i data-lucide="external-link" class="w-2 h-2 opacity-50 group-hover:opacity-100 transition-opacity"></i></p>
                            <p class="text-xl font-black text-violet-400 leading-none" id="stat-nuvem">-</p>
                        </div>
                    </div>
                    <button onclick="clearCurrentTab()" class="w-full py-2 bg-red-500/20 text-red-400 rounded-xl text-[10px] font-black uppercase hover:bg-red-500 hover:text-white transition-all">Limpar Registos Locais</button>
                </div>
            </aside>

            <section id="cards-grid" class="lg:col-span-2">
                <div id="concluidos-tools" class="hidden mb-4 solid-panel p-4 rounded-3xl shadow-sm border-l-4 border-l-emerald-500 bg-emerald-50/50">
                    <button onclick="acaoSalvarTodos()" class="w-full bg-emerald-600 text-white px-6 py-3 rounded-xl font-black text-[10px] uppercase shadow-lg hover:bg-emerald-700 transition-all">Sincronizar Todos com Planilha Google</button>
                </div>
                <div id="etiquetas-tools" class="hidden mb-4 solid-panel p-4 rounded-3xl shadow-sm border-l-4 border-l-amber-500 bg-amber-50/50">
                    <button onclick="exportarEtiquetas()" class="w-full bg-green-600 text-white px-6 py-3 rounded-xl font-black text-[10px] uppercase shadow-lg hover:bg-green-700 transition-all">Gerar Excel de Etiquetas</button>
                </div>

                <div id="tiago" class="tab-content active"><div class="space-y-4" id="container-tiago"></div></div>
                <div id="alana" class="tab-content"><div class="space-y-4" id="container-alana"></div></div>
                <div id="william" class="tab-content"><div class="space-y-4" id="container-william"></div></div>
                <div id="viviane" class="tab-content"><div class="space-y-4" id="container-viviane"></div></div>
                <div id="bolsoes" class="tab-content"><div class="space-y-4" id="container-bolsoes"></div></div>
                <div id="concluidos" class="tab-content"><div class="space-y-4" id="container-concluidos"></div></div>
                <div id="etiquetas" class="tab-content"><div class="space-y-4" id="container-etiquetas"></div></div>

                <div id="empty-state" class="py-20 text-center opacity-30 flex flex-col items-center">
                    <i data-lucide="inbox" class="w-16 h-16"></i>
                    <p class="text-sm font-black uppercase mt-2">Lista Vazia</p>
                </div>
            </section>
        </div>
    </main>

    <script>
        // ==========================================
        // REMOÇÃO DO SERVICE WORKER (Desativa o Cache do PWA)
        // ==========================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }

        // ==========================================
        // INICIALIZAÇÃO DO CLOUD FIRESTORE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCpDi18ridgdvc1GK6VLHlvJ1UDRbZGyl0",
            authDomain: "pcp-projeto-4aa40.firebaseapp.com",
            projectId: "pcp-projeto-4aa40",
            storageBucket: "pcp-projeto-4aa40.firebasestorage.app",
            messagingSenderId: "850834146931",
            appId: "1:850834146931:web:1524870b589fafaaef4c06"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.collection('estoque_bolsoes').onSnapshot((snapshot) => {
            document.getElementById('stat-nuvem').innerText = snapshot.size;
        }, (error) => {
            document.getElementById('stat-nuvem').innerText = "!";
        });

        // ==========================================
        // FUNÇÕES DO MODAL
        // ==========================================
        function abrirEstoqueNuvem() {
            const modal = document.getElementById('cloud-modal-overlay');
            const lista = document.getElementById('cloud-modal-list');
            modal.style.display = 'flex';
            lista.innerHTML = '<div class="text-center text-violet-500 py-10 font-bold text-xs animate-pulse">Carregando Estoque...</div>';

            db.collection('estoque_bolsoes').get().then((querySnapshot) => {
                lista.innerHTML = '';
                
                if (querySnapshot.empty) {
                    lista.innerHTML = `
                        <div class="text-center text-slate-400 py-10 flex flex-col items-center">
                            <i data-lucide="package-x" class="w-10 h-10 mb-2 opacity-50"></i>
                            <p class="font-bold text-xs uppercase tracking-wider">Estoque Vazio</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const dados = doc.data();
                    const dataLog = dados['_dataSalvamento'] || '--/--/----';
                    
                    const branch = dados['_branch_modal'] || dados['Branch via argos'] || dados['Branch Via Argo'] || '';
                    const tipoServico = dados['_servico_modal'] || dados['Tipo de serviço'] || '';
                    const tituloChamado = dados['_titulo_modal'] || '';
                    
                    let badgesHTML = '';
                    if(branch) badgesHTML += `<div class="flex items-center gap-1 bg-slate-100 border border-slate-200 px-2 py-1 rounded-md text-[9px] font-bold text-slate-600 shadow-sm"><i data-lucide="map-pin" class="w-3 h-3 text-slate-400"></i> ${branch}</div>`;
                    if(tipoServico) badgesHTML += `<div class="flex items-center gap-1 bg-slate-100 border border-slate-200 px-2 py-1 rounded-md text-[9px] font-bold text-slate-600 shadow-sm"><i data-lucide="wrench" class="w-3 h-3 text-slate-400"></i> ${tipoServico}</div>`;

                    let previewHTML = '';
                    camposSeriais.forEach(c => {
                        if (dados[c] && String(dados[c]).trim() !== '') {
                            let nomeCurto = c.replace('Serial ', '');
                            previewHTML += `<span class="inline-block bg-white border border-slate-200 shadow-sm rounded px-1.5 py-0.5 text-[8.5px] font-bold text-slate-500 mr-1.5 mb-1.5">${nomeCurto}: <span class="text-slate-800">${dados[c]}</span></span>`;
                        }
                    });

                    if(previewHTML === '') previewHTML = '<span class="text-[9px] text-slate-400 italic">Nenhum serial bipado neste kit</span>';
                    
                    lista.innerHTML += `
                        <div class="flex flex-col bg-slate-50 p-4 rounded-xl border border-slate-200 mb-3 hover:border-violet-300 hover:shadow-sm transition-all group gap-2">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center w-full gap-3">
                                <div class="flex items-center gap-2">
                                    <p class="font-black text-slate-800 text-[14px] tracking-tight flex items-center gap-1.5">
                                        <i data-lucide="package" class="w-4 h-4 text-violet-500"></i> ${doc.id}
                                    </p>
                                    ${tituloChamado ? `<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-black tracking-tight border border-blue-200 uppercase">${tituloChamado}</span>` : ''}
                                </div>
                                <div class="flex flex-wrap items-center gap-1.5">
                                    ${badgesHTML}
                                    <div class="flex items-center gap-1.5 bg-slate-200/60 px-2 py-1 rounded-md text-[9px] font-bold text-slate-500 shadow-sm">
                                        <i data-lucide="clock" class="w-3 h-3 text-slate-400"></i> Salvo em: ${dataLog}
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex flex-wrap items-center w-full mt-1 border-t border-slate-200/50 pt-2">
                                ${previewHTML}
                            </div>
                            
                            <div class="flex gap-2 w-full sm:w-auto opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity self-end mt-1">
                                <button onclick="imprimirEtiquetaNuvem('${doc.id}')" class="flex items-center justify-center gap-1 bg-slate-200 text-slate-700 hover:bg-slate-300 hover:text-slate-900 px-3 py-1.5 rounded-lg transition-colors shadow-sm text-[9px] font-bold uppercase" title="Imprimir Etiqueta">
                                    <i data-lucide="printer" class="w-3 h-3"></i> Imprimir
                                </button>
                                <button onclick="copiarIDBolsao('${doc.id}')" class="flex-1 sm:flex-none flex items-center justify-center gap-1 bg-blue-100 text-blue-600 hover:bg-blue-600 hover:text-white px-3 py-1.5 rounded-lg transition-colors shadow-sm text-[9px] font-bold uppercase" title="Copiar ID do Kit">
                                    <i data-lucide="copy" class="w-3 h-3"></i> Copiar ID
                                </button>
                                <button onclick="editarBolsaoNuvem('${doc.id}')" class="flex items-center justify-center bg-amber-100 text-amber-600 hover:bg-amber-500 hover:text-white px-3 py-1.5 rounded-lg transition-colors shadow-sm" title="Editar Seriais deste Kit">
                                    <i data-lucide="pencil" class="w-3 h-3"></i>
                                </button>
                                <button onclick="excluirBolsaoNuvem('${doc.id}')" class="flex items-center justify-center bg-red-100 text-red-600 hover:bg-red-600 hover:text-white px-3 py-1.5 rounded-lg transition-colors shadow-sm" title="Excluir Permanentemente">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                lucide.createIcons();
            }).catch((error) => {
                lista.innerHTML = `<div class="text-center text-red-500 py-10 font-bold text-xs">Erro de conexão: ${error.message}</div>`;
            });
        }

        // ==========================================
        // SISTEMA DE IMPRESSÃO (BLINDADO COM POSITION ABSOLUTE)
        // ==========================================
        function imprimirEtiquetaNuvem(id) {
            const janelaImpressao = window.open('', '_blank', 'width=400,height=600');
            if(!janelaImpressao) { alert("⚠️ O Chrome bloqueou a impressão. Permita pop-ups na barra de endereços."); return; }
            janelaImpressao.document.write('<h3 style="font-family:sans-serif; text-align:center; margin-top:20px;">Carregando dados...</h3>');

            db.collection("estoque_bolsoes").doc(id).get().then((docSnapshot) => {
                if (docSnapshot.exists) {
                    const dados = docSnapshot.data();
                    const branch = dados['_branch_modal'] || dados['Branch via argos'] || dados['Branch Via Argo'] || '';
                    const tipoServico = dados['_servico_modal'] || dados['Tipo de serviço'] || '';
                    _renderizarEtiqueta(janelaImpressao, id, tipoServico, branch);
                } else {
                    janelaImpressao.close(); alert("Kit não encontrado na Nuvem!");
                }
            }).catch(err => { janelaImpressao.close(); alert("Erro: " + err.message); });
        }

        function imprimirEtiquetaLocal(id) {
            const item = store.bolsoes.find(x => x._id === id);
            if(item) {
                const janelaImpressao = window.open('', '_blank', 'width=400,height=600');
                if(!janelaImpressao) { alert("⚠️ O Chrome bloqueou a impressão. Permita pop-ups!"); return; }
                
                let titulo = item[item._titleField] || "KIT";
                let foundBranch = ''; let foundServico = '';
                for (let k in item) {
                    let kLow = k.toLowerCase();
                    if (kLow.includes('branch') || kLow.includes('argos') || kLow.includes('cliente')) foundBranch = item[k];
                    if (kLow.includes('tipo de serviço') || kLow.includes('serviço') || kLow.includes('servico')) foundServico = item[k];
                }
                _renderizarEtiqueta(janelaImpressao, titulo, foundServico, foundBranch);
            }
        }

        function _renderizarEtiqueta(janela, titulo, servico, branch) {
            janela.document.open();
            janela.document.write(`
                <html>
                <head>
                    <title>Etiqueta Kit ${titulo}</title>
                    <style>
                        /* Força a remoção das margens de página do Chrome */
                        @page { 
                            margin: 0 !important; 
                            size: 29mm 36mm; 
                        }
                        body {
                            margin: 0 !important;
                            padding: 0 !important;
                            width: 29mm;
                            height: 36mm;
                            background: white;
                            overflow: hidden;
                            position: relative;
                            font-family: 'Arial', sans-serif;
                        }
                        /* O container é girado pelo canto superior esquerdo para não esmagar no meio */
                        .label-wrapper {
                            position: absolute;
                            top: 0;
                            left: 28.5mm; /* Move o eixo para a borda após girar */
                            width: 36mm;  /* A altura vira a largura */
                            height: 28mm; /* A largura vira a altura */
                            transform-origin: top left;
                            transform: rotate(90deg); 
                            display: flex;
                            flex-direction: row;
                            align-items: center;
                            justify-content: flex-start;
                            box-sizing: border-box;
                            padding: 1.5mm;
                        }
                        .qr-col {
                            width: 13mm;
                            height: 13mm;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            margin-right: 1.5mm;
                            flex-shrink: 0;
                        }
                        .qr-code { 
                            width: 100%; 
                            height: 100%; 
                        }
                        .text-col {
                            flex: 1;
                            display: flex;
                            flex-direction: column;
                            justify-content: center;
                            text-align: left;
                            overflow: hidden;
                        }
                        .title { 
                            font-size: 8.5pt; 
                            font-weight: 900; 
                            margin-bottom: 1mm; 
                            text-transform: uppercase; 
                            line-height: 1;
                            color: #000;
                            letter-spacing: -0.2px;
                            white-space: nowrap;

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const isCSV = file.name.toLowerCase().endsWith('.csv');
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    let workbook;
                    if (isCSV) { workbook = XLSX.read(e.target.result, { type: 'string' }); } 
                    else { const data = new Uint8Array(e.target.result); workbook = XLSX.read(data, { type: 'array' }); }
                    processSheet(workbook.Sheets[workbook.SheetNames[0]]);
                } catch(err) { alert("Erro ao ler arquivo."); }
            };
            if (isCSV) { reader.readAsText(file, 'UTF-8'); } else { reader.readAsArrayBuffer(file); }
            event.target.value = '';
        }

        function processPastedData() {
            const text = document.getElementById('paste-area').value;
            if (text.trim()) {
                const wb = XLSX.read(text, {type: 'string'});
                processSheet(wb.Sheets[wb.SheetNames[0]]);
                document.getElementById('paste-area').value = '';
            }
        }

        function formatarSeriais() {
            const textArea = document.getElementById('paste-area');
            const text = textArea.value;
            if (!text.trim()) return;
            const seriais = text.split(/[\n\t\s,]+/).filter(s => s.trim() !== '');
            const formatado = seriais.join(',');
            textArea.value = formatado;
            navigator.clipboard.writeText(formatado).then(() => {
                const btn = document.getElementById('btn-formatar');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i data-lucide="check" class="w-3 h-3"></i> Copiado!';
                btn.classList.replace('bg-blue-600', 'bg-emerald-600');
                lucide.createIcons();
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.classList.replace('bg-emerald-600', 'bg-blue-600');
                    lucide.createIcons();
                }, 2000);
            });
        }

        function processSheet(sheet) {
            const rows = XLSX.utils.sheet_to_json(sheet, {header: 1});
            if (rows.length < 1) return;
            const rawHeaders = rows[0].map(h => (h || "").toString().trim());
            const dataRows = rows.slice(1);
            const processed = dataRows.map(rowArray => {
                let item = {};
                rawHeaders.forEach((h, idx) => {
                    let val = (rowArray[idx] || "").toString().trim();
                    if (!val) return;
                    let cleanKey = h.replace(/Campo personalizado \((.*?)\)/g, '$1').replace('Campo personalizado ', '');
                    if (item[cleanKey]) item[cleanKey] += " + " + val;
                    else item[cleanKey] = val;
                });
                let titleField = item["Chave da ocorrência"] ? "Chave da ocorrência" : (item["Chamados"] ? "Chamados" : rawHeaders[0]);
                let link = null;
                const match = JSON.stringify(item).match(/(CONFIGURAR|PROCONFIG)-\d+/i);
                if (match) link = JIRA_BASE_URL + match[0].toUpperCase();
                return { ...item, _id: 'ID-'+Math.random().toString(36).substr(2,9), _origin: currentTab, _link: link, _titleField: titleField };
            });
            store[currentTab] = [...store[currentTab], ...processed];
            save(); render();
        }

        function handleEnter(e, cardId) {
            if (e.key === 'Enter') { e.preventDefault(); advanceToNextInput(e.target, cardId); }
        }

        function advanceToNextInput(currentEl, cardId) {
            const now = Date.now();
            if (now - lastJumpTime < 150) return; 
            const inputs = Array.from(document.querySelectorAll(`.serial-input-${cardId}`));
            const currentIndex = inputs.indexOf(currentEl);
            for (let i = currentIndex + 1; i < inputs.length; i++) {
                if (inputs[i].value.trim() === '') { inputs[i].focus(); lastJumpTime = now; return; }
            }
            if (currentIndex > -1 && currentIndex < inputs.length - 1) { inputs[currentIndex + 1].focus(); lastJumpTime = now; }
        }

        function validateAndAdvance(el, campo, cardId) {
            const val = String(el.value || '');
            const digitsOnly = val.replace(/\D/g, '');
            el.classList.remove('bg-slate-50', 'border-slate-200', 'focus:ring-blue-500', 'bg-red-50', 'border-red-500', 'text-red-600', 'focus:ring-red-500', 'bg-emerald-50', 'border-emerald-500', 'text-emerald-700', 'focus:ring-emerald-500');
            if (val.trim() === '') { el.classList.add('bg-slate-50', 'border-slate-200', 'focus:ring-blue-500'); el.dataset.valid = "false"; return; }

            let isValid = false;
            if (campo === 'Iccid' || campo === 'Iccid Camera') isValid = digitsOnly.length === 20;
            else if (campo === 'Serial TX009' || campo === 'Serial Leitor' || campo === 'Serial Teclado') isValid = digitsOnly.length === 6;
            else if (campo === 'Serial Smart Speaker') isValid = digitsOnly.length === 4;
            else if (campo === 'Serial Câmera') isValid = digitsOnly.length === 15;
            else if (campo === 'Serial Rastreador') {
                if (digitsOnly.startsWith('4675') || digitsOnly.startsWith('4634')) isValid = digitsOnly.length === 10;
                else if (digitsOnly.startsWith('86') || digitsOnly.startsWith('35')) isValid = digitsOnly.length === 15;
            }

            if (!isValid) {
                el.classList.add('bg-red-50', 'border-red-500', 'text-red-600', 'focus:ring-red-500');
                el.dataset.valid = "false";
            } else {
                el.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-700', 'focus:ring-emerald-500');
                if (el.dataset.valid !== "true") { el.dataset.valid = "true"; advanceToNextInput(el, cardId); }
            }
        }

                camposSeriais.forEach(c => {

                    if (val.length > 0) {

                        else if (c === 'Serial TX009' || c === 'Serial Leitor' || c === 'Serial Teclado') { isValid = digitsOnly.length === 6; needsValidation = true; } 
                        else if (c === 'Serial Smart Speaker') { isValid = digitsOnly.length === 4; needsValidation = true; } 
                        else if (c === 'Serial Câmera') { isValid = digitsOnly.length === 15; needsValidation = true; } 
                        else if (c === 'Serial Rastreador') {
                            needsValidation = true;
                            if (digitsOnly.startsWith('4675') || digitsOnly.startsWith('4634')) { isValid = digitsOnly.length === 10; } 
                            else if (digitsOnly.startsWith('86') || digitsOnly.startsWith('35')) { isValid = digitsOnly.length === 15; } 
                            else { isValid = false; }
                        }

                        if (needsValidation) {
                            if (!isValid) { colorClasses = "bg-red-50 border-red-500 text-red-600 focus:ring-red-500"; }

                });
                
                card.innerHTML = `

        function abrirJiraComDados(id) {
            const item = store[currentTab].find(x => x._id === id);
            if (!item || !item._link) return;
            const dadosParaEnviar = { serial: item["Serial Rastreador"] || "", iccid: item["Iccid"] || "", tx009: item["Serial TX009"] || "", leitor: item["Serial Leitor"] || "", teclado: item["Serial Teclado"] || "", smartspeaker: item["Serial Smart Speaker"] || "", camera: item["Serial Câmera"] || "" };
            const urlJira = new URL(item._link);
            urlJira.searchParams.append("autofill", "true");
            Object.entries(dadosParaEnviar).forEach(([chave, valor]) => { if (valor && valor.toString().trim() !== "") { urlJira.searchParams.append(chave, valor); } });
            window.open(urlJira.toString(), '_blank');
        }

        function acaoSalvarTodos() {
            if (store.concluidos.length === 0) return;
            isBatchSubmit = true;
            showLoading("Enviando para Planilha Google...");
            submissionQueue = [...store.concluidos];
            processNextInQueue();
        }

        function enviarIndividual(id) {
            const item = store.concluidos.find(i => i._id === id);
            if (!item) return;
            isBatchSubmit = false;
            showLoading("Enviando para Planilha Google...");
            submissionQueue = [item];
            processNextInQueue();
        }

        function processNextInQueue() {
            if (submissionQueue.length === 0) {
                hideLoading();
                if (isBatchSubmit) alert("Sincronização de todos os cards concluída!");
                return;
            }
            const item = submissionQueue.shift();
            currentProcessingId = item._id;
            
            const form = document.createElement('form');
            form.method = 'POST'; form.action = WEB_APP_URL; form.target = 'hidden_iframe';
            Object.entries(item).forEach(([k, v]) => {
                if (!k.startsWith('_') || k === '_origin') {
                    const inp = document.createElement('input');
                    inp.type = 'hidden'; inp.name = k; inp.value = v;
                    form.appendChild(inp);
                }
            });
            document.body.appendChild(form); form.submit(); document.body.removeChild(form);
        }

        window.finalizeSubmit = function() {
            if (currentProcessingId) {
                const idx = store.concluidos.findIndex(i => i._id === currentProcessingId);
                if (idx > -1) {
                    const item = store.concluidos.splice(idx, 1)[0];
                    item._concluidoEm = new Date().toLocaleString();
                    store.etiquetas.unshift(item);
                    save(); render();
                }
                currentProcessingId = null;
                processNextInQueue();
            }
        };

        function exportarEtiquetas() {
            if(store.etiquetas.length === 0) return;
            const data = store.etiquetas.map(i => ({
                "Serial Rastreador": i["Serial Rastreador"] || "",
                "ICCID": i["Iccid"] || "",
                "Cliente": i["Branch via argos"] || i["Branch Via Argo"] || "",
                "Serviço": i["Tipo de serviço"] || "",
                "Placa": i["Placas"] || "",
		        "Tipo de firmware": i["Tipo de firmware"] || "",
                "Data": i._concluidoEm || "",
                "Materiais": i["Material para manutenção"] || ""
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Etiquetas");
            
            XLSX.writeFile(wb, "Etiquetas_PCP.xlsx");
            setTimeout(() => {
                if(confirm("Planilha baixada! Deseja limpar os registros da aba de Etiquetas?")) { store.etiquetas = []; save(); render(); }
            }, 500);
        }

        function updateVal(id,f,v) { const i = store[currentTab].find(x=>x._id===id); if(i){i[f]=v;save();} }
        function clearCurrentTab() { if(confirm("Limpar dados desta aba?")) { store[currentTab]=[]; save(); render(); } }
        
        function switchTab(id) { 
            currentTab = id;
            document.querySelectorAll('.tab-button').forEach(b => b.classList.toggle('active', b.id === 'btn-'+id));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === id));
            document.getElementById('current-name').innerText = id === 'bolsoes' ? 'KITS' : id.charAt(0).toUpperCase() + id.slice(1);
            document.getElementById('concluidos-tools').classList.toggle('hidden', id !== 'concluidos');
            document.getElementById('etiquetas-tools').classList.toggle('hidden', id !== 'etiquetas');
            document.getElementById('search-input').value = '';
            render();
        }
        
        function updateStats() {
            // Contagem do Firestore é feita por um listener separado
            document.getElementById('stat-total').innerText = store.tiago.length + store.alana.length + store.william.length + store.viviane.length + store.bolsoes.length;
            document.getElementById('stat-done').innerText = store.concluidos.length;
        }
        
        function filterCards() {
            const q = document.getElementById('search-input').value.toLowerCase();
            let visibleCount = 0;
            document.querySelectorAll('.card-animation').forEach(c => {
                const isMatch = c.innerText.toLowerCase().includes(q);
                c.style.display = isMatch ? 'block' : 'none';
                if (isMatch) visibleCount++; 
            });
            if (q.trim() !== '') {
                if (['tiago', 'alana', 'william', 'viviane', 'bolsoes'].includes(currentTab)) { document.getElementById('stat-total').innerText = visibleCount; } 
                else if (currentTab === 'concluidos') { document.getElementById('stat-done').innerText = visibleCount; }
            } else { updateStats(); }
        }

        window.onload = () => { render(); updateStats(); };
    </script>
</body>
</html>
